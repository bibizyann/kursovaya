apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: factory-monitoring
resources:
  - monitors.yaml
  - rbac.yaml
  - rules.yaml
configMapGenerator:
  - name: factory-dashboards
    files:
      - dashboards/equipment.json
      - dashboards/readings.json
      - dashboards/processes.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
