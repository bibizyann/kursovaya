# This rule is not used by the project factory-platform itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the production.factory.local.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: factory-platform
    app.kubernetes.io/managed-by: kustomize
  name: techprocess-editor-role
rules:
- apiGroups:
  - production.factory.local
  resources:
  - techprocesses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - production.factory.local
  resources:
  - techprocesses/status
  verbs:
  - get
