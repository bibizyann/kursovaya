# This rule is not used by the project factory-platform itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over production.factory.local.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: factory-platform
    app.kubernetes.io/managed-by: kustomize
  name: techprocesstemplate-admin-role
rules:
- apiGroups:
  - production.factory.local
  resources:
  - techprocesstemplates
  verbs:
  - '*'
- apiGroups:
  - production.factory.local
  resources:
  - techprocesstemplates/status
  verbs:
  - get
