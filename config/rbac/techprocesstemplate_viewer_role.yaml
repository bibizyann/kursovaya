# This rule is not used by the project factory-platform itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to production.factory.local resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: factory-platform
    app.kubernetes.io/managed-by: kustomize
  name: techprocesstemplate-viewer-role
rules:
- apiGroups:
  - production.factory.local
  resources:
  - techprocesstemplates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - production.factory.local
  resources:
  - techprocesstemplates/status
  verbs:
  - get
