apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-api
  namespace: factory-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: factory-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: factory-api
    spec:
      serviceAccountName: factory-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: factory-api:dev
          imagePullPolicy: IfNotPresent
          args:
            - --listen=:8081
            - --namespace=factory-demo
            - --process=line-one
            - --prometheus-url=http://factory-monitoring-prometheus.factory-monitoring.svc:9090
            - --grafana-url=http://localhost:3000
          ports:
            - name: http
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: factory-api
  namespace: factory-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: factory-api
  ports:
    - name: http
      port: 8081
      targetPort: http
