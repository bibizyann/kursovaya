apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-api
  namespace: factory-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-overview-reader
  namespace: factory-demo
rules:
  - apiGroups: [production.factory.local]
    resources: [techprocesses, techprocesstemplates]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, replicasets]
    verbs: [list]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-overview-reader
  namespace: factory-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-overview-reader
subjects:
  - kind: ServiceAccount
    name: factory-api
    namespace: factory-ui
