apiVersion: production.factory.local/v1alpha1
kind: TechProcess
metadata:
  name: line-one
  namespace: factory-demo
  labels:
    app.kubernetes.io/part-of: factory-platform
spec:
  templateRef:
    name: board-a
  targetSelector:
    matchLabels:
      factory.local/line: line-one
  parameters:
    # Descriptive only: device recipes are selected by --product in the template.
    product: board-a
  rollout:
    strategy: Recreate
  timeout: 5m
