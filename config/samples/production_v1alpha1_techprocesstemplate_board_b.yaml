apiVersion: production.factory.local/v1alpha1
kind: TechProcessTemplate
metadata:
  name: board-b
  namespace: factory-demo
  labels:
    app.kubernetes.io/part-of: factory-platform
spec:
  revision: 2.0.0
  description: Simulated small-batch assembly workshop for board-b
  components:
    - name: paste-printer-01
      workload: Deployment
      image: equipment-simulator:dev
      args:
        - --equipment=paste-printer-01
        - --product=board-b
      requiredCapabilities:
        matchLabels:
          factory.local/paste-printing: "true"
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /readyz
          port: http
        periodSeconds: 2
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        periodSeconds: 10
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
    - name: component-placer-01
      workload: Deployment
      image: equipment-simulator:dev
      args:
        - --equipment=component-placer-01
