apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-receiver
  labels:
    app.kubernetes.io/name: telemetry-receiver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-receiver
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: telemetry-receiver:dev
          imagePullPolicy: IfNotPresent
          args:
            - --listen=:9091
            - --mqtt-broker=tcp://mosquitto.factory-telemetry.svc.cluster.local:1883
            - --freshness-timeout=20s
            - --expected=factory-demo/line-one/paste-printer-01
            - --expected=factory-demo/line-one/component-placer-01
            - --expected=factory-demo/line-one/reflow-oven-01
            - --expected=factory-demo/line-one/optical-inspector-01
            - --expected=factory-demo/line-one/manual-soldering-01
            - --expected=factory-demo/line-one/programmer-01
            - --expected=factory-demo/line-one/test-power-supply-01
            - --expected=factory-demo/line-one/test-multimeter-01
          ports:
            - name: metrics
              containerPort: 9091
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-receiver
  labels:
    app.kubernetes.io/name: telemetry-receiver
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: telemetry-receiver
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
