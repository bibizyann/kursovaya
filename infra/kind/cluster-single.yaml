kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      factory.local/line: line-one
      factory.local/workstation: all-in-one-development
      factory.local/paste-printing: "true"
      factory.local/component-placement: "true"
      factory.local/reflow-soldering: "true"
      factory.local/optical-inspection: "true"
      factory.local/manual-assembly: "true"
      factory.local/programming-test: "true"
