kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    labels:
      factory.local/line: line-one
      factory.local/workstation: vision-primary
      factory.local/camera: "true"
  - role: worker
    labels:
      factory.local/line: line-one
      factory.local/workstation: tester-primary
      factory.local/tester: model-x
  - role: worker
    labels:
      factory.local/line: line-one
      factory.local/workstation: universal-spare
      factory.local/camera: "true"
      factory.local/tester: model-x
      factory.local/spare-group: line-one
