kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    labels:
      factory.local/line: line-one
      factory.local/workstation: smt-assembly
      factory.local/paste-printing: "true"
      factory.local/component-placement: "true"
      factory.local/reflow-soldering: "true"
  - role: worker
    labels:
      factory.local/line: line-one
      factory.local/workstation: inspection-and-test
      factory.local/optical-inspection: "true"
      factory.local/manual-assembly: "true"
      factory.local/programming-test: "true"
  - role: worker
    labels:
      factory.local/line: line-one
      factory.local/workstation: simulated-spare
      factory.local/paste-printing: "true"
      factory.local/component-placement: "true"
      factory.local/reflow-soldering: "true"
      factory.local/optical-inspection: "true"
      factory.local/manual-assembly: "true"
      factory.local/programming-test: "true"
      factory.local/spare-group: line-one
