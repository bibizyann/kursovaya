stages:
  - verify
  - test
  - build

default:
  image: golang:1.26
  interruptible: true
  cache:
    key: go-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/go-build
      - .cache/go-mod
  variables:
    GOCACHE: ${CI_PROJECT_DIR}/.cache/go-build
    GOMODCACHE: ${CI_PROJECT_DIR}/.cache/go-mod

before_script:
  - go mod download

lint:
  stage: verify
  script:
    - make lint-config
    - make lint

unit:
  stage: test
  script:
    - make test-unit

controller-integration:
  stage: test
  script:
    - make test
  artifacts:
    when: always
    paths:
      - cover.out
    expire_in: 7 days

build:
  stage: build
  script:
    - make build build-simulator
  artifacts:
    paths:
      - bin/manager
      - bin/equipment-simulator
    expire_in: 7 days
